name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  # OIDC lets npm verify this workflow's identity without storing a token.
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # Do not use dependency caching for release builds.
          package-manager-cache: false

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json = $PKG_VERSION, tag = $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag ($TAG_VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Check whether the npm version already exists
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "opencode-wait-for-v2@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::error::npm already has $PKG_VERSION; bump the version first"
            exit 1
          fi
          echo "Version $PKG_VERSION is not published yet; continuing"

      - name: Unit tests
        run: bun test

      - name: Verify the plugin builds
        run: |
          bun build index.ts --target=node --outfile=/tmp/check.js
          echo "Build passed; artifact size: $(wc -c </tmp/check.js) bytes"

      - name: Packaging check (no publish)
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public

      - name: Write result
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "### Published opencode-wait-for-v2@$PKG_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm: https://www.npmjs.com/package/opencode-wait-for-v2/v/$PKG_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- install: \`opencode plugin add opencode-wait-for-v2\`" >> "$GITHUB_STEP_SUMMARY"
