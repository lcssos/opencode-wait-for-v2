name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  # OIDC：让 npm 验证这个 workflow 的身份，无需保管任何 token
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # 发布构建不要用依赖缓存
          package-manager-cache: false

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json = $PKG_VERSION, tag = $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag ($TAG_VERSION) 与 package.json ($PKG_VERSION) 版本不一致"
            exit 1
          fi

      - name: 检查 npm 版本已存在
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "opencode-wait-for-v2@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::error::npm 上已存在 $PKG_VERSION，请先提升版本号"
            exit 1
          fi
          echo "版本 $PKG_VERSION 尚未发布，继续"

      - name: 单元测试
        run: bun test

      - name: 校验插件可构建
        run: |
          bun build index.ts --target=node --outfile=/tmp/check.js
          echo "构建通过，产物大小：$(wc -c </tmp/check.js) 字节"

      - name: 打包检查（不发布）
        run: npm pack --dry-run

      - name: 发布到 npm
        run: npm publish --access public

      - name: 输出结果
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "### 已发布 opencode-wait-for-v2@$PKG_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm: https://www.npmjs.com/package/opencode-wait-for-v2/v/$PKG_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- 安装: \`opencode plugin add opencode-wait-for-v2\`" >> "$GITHUB_STEP_SUMMARY"
