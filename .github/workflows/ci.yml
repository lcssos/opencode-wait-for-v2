name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Unit tests
        run: bun test

      - name: Build check (entry resolves through the bundler)
        run: |
          bun build index.ts --target=node --outfile=/tmp/check.js
          echo "Build passed; artifact size: $(wc -c </tmp/check.js) bytes"

      - name: Confirm required files are in the publish manifest
        run: |
          bun pm pack --dry-run 2>/dev/null || npm pack --dry-run
